name: 功能建议
description: 提议一个有明确学生工作场景的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述真实工作流程中的麻烦，不要只写功能名称。
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 目前怎么处理
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 明确不做什么
      description: 说明建议的最小边界，避免一次扩张成完整平台。
  - type: checkboxes
    id: constraints
    attributes:
      label: v0.1.0 边界
      options:
        - label: 该建议不要求自动读取或发送微信/QQ 消息
        - label: 该建议不要求云账号、多人实时协作或学校系统集成
        - label: 我没有在内容中放入真实个人信息或组织内部材料
          required: true
