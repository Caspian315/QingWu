name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-and-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Create sidecar placeholder for static Rust check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/binaries/qingwu-sidecar-x86_64-pc-windows-msvc.exe | Out-Null
      - run: cargo check --manifest-path src-tauri/Cargo.toml
