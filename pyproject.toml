[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qingwu-core"
version = "0.1.0"
description = "Local-first core and sidecar for Qingwu"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Qingwu Contributors" }]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "python-docx>=1.1.2,<2",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
qingwu = "qingwu_core.cli:main"
qingwu-sidecar = "qingwu_core.sidecar:main"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.data-files]
"share/qingwu/templates" = [
  "templates/activity-organization.yaml",
  "templates/material-collection.yaml",
  "templates/reimbursement.yaml",
]
"share/qingwu/schemas" = ["schemas/workflow-template.schema.json"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"
